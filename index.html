<style>
:root{--bg:#eef5f7;--card:#fff;--tx:#1c2024;--mu:#6b7280;--bd:#e3e5e8;--pri:#2f8f9f;--g0:#2f9e5b;--g1:#c99a06;--g2:#e07b1a;--g3:#e5484d;--low:#3e8ee5}
@media(prefers-color-scheme:dark){:root{--bg:#0f1719;--card:#182226;--tx:#eceef0;--mu:#9aa1ab;--bd:#2c3037}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 6px;font-size:20px;font-weight:700}
header img{width:38px;height:38px;border-radius:10px;box-shadow:0 2px 6px rgba(47,143,159,.35)}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 12px 10px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 13px;border-radius:999px;font-size:14px}
nav button.on{background:var(--pri);border-color:var(--pri);color:#fff}
main{padding:0 12px 40px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:16px}
.muted{color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:90px}
label{display:block;font-size:12px;color:var(--mu);margin:6px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
textarea{min-height:90px;font-size:14px}
.btn{display:block;width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-size:16px;font-weight:600}
.btn.sub{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.btn.red{background:var(--g3)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;color:#fff}
.b0{background:var(--g0)}.b1{background:var(--g1)}.b2{background:var(--g2)}.b3{background:var(--g3)}.blow{background:var(--low)}
.big{font-size:26px;font-weight:700}
.big small{font-size:13px;font-weight:400;color:var(--mu)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:0}
.item .l{min-width:0}
.item .x{border:0;background:none;color:var(--mu);font-size:18px;padding:4px 8px}
.item select{width:auto;padding:3px 6px;font-size:12px;margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--bd);padding:6px 7px;text-align:left;vertical-align:top}
th{background:var(--bg)}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button{flex:1;padding:6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;font-size:13px}
.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:12px;word-break:break-all}
ol,ul{padding-left:20px;margin:6px 0}
li{margin:4px 0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90%}
#toast.on{opacity:.95}
svg text{fill:var(--mu);font-size:9px}

<nav id="nav"></nav>
<main id="main"></main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const KEY='hlog.v1',SKEY='hlog.set';
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let recs=load(KEY,[]),set=load(SKEY,{height:''});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(recs));localStorage.setItem(SKEY,JSON.stringify(set))}catch(e){toast('저장 공간 오류')}};
let tab='home',range=30,hrange=0;
const TABS=[['home','홈'],['glucose','혈당'],['bp','혈압'],['weight','체중'],['criteria','기준'],['sync','건강앱 연동']];
const CTX={fasting:'공복',post:'식후 2시간',random:'임의',bedtime:'취침 전'};
const NAME={glucose:'혈당',bp:'혈압',weight:'체중'};
const p2=n=>String(n).padStart(2,'0');
const fmt=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`};
const nowInput=()=>{const d=new Date();return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`};
const parseT=s=>{if(!s)return null;const d=new Date(String(s).trim().replace(' ','T'));return isNaN(d)?null:d.getTime()};
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}

/* ---------- 기준 판정 ---------- */
function stGlucose(v,ctx){
  if(v<70)return{t:'저혈당',lv:'low'};
  if(ctx==='fasting'){if(v<100)return{t:'정상',lv:0};if(v<126)return{t:'공복혈당장애(전단계)',lv:1};return{t:'당뇨병 범위',lv:3}}
  if(v<140)return{t:'정상',lv:0};
  if(v<200)return{t:ctx==='post'?'내당능장애(전단계)':'주의',lv:1};
  return{t:'당뇨병 범위',lv:3};
}
function stBP(s,d){
  if(s>=160||d>=100)return{t:'2기 고혈압',lv:3};
  if(s>=140&&d<90)return{t:'수축기 단독 고혈압',lv:2};
  if(s>=140||d>=90)return{t:'1기 고혈압',lv:2};
  if(s>=130||d>=80)return{t:'고혈압 전단계',lv:1};
  if(s>=120)return{t:'주의혈압',lv:1};
  if(s<90||d<60)return{t:'저혈압 주의',lv:'low'};
  return{t:'정상',lv:0};
}
const bmiOf=w=>{const h=parseFloat(set.height);return h>0?w/Math.pow(h/100,2):null};
function stBMI(b){
  if(b<18.5)return{t:'저체중',lv:'low'};
  if(b<23)return{t:'정상',lv:0};
  if(b<25)return{t:'과체중(비만 전단계)',lv:1};
  if(b<30)return{t:'1단계 비만',lv:2};
  if(b<35)return{t:'2단계 비만',lv:3};
  return{t:'3단계 비만',lv:3};
}
const badge=s=>`<span class="badge b${s.lv}">${s.t}</span>`;
function statusOf(r){
  if(r.type==='glucose')return stGlucose(r.v,r.ctx);
  if(r.type==='bp')return stBP(r.sys,r.dia);
  const b=bmiOf(r.w);return b?stBMI(b):null;
}
function valText(r){
  if(r.type==='glucose')return `${r.v}<small> mg/dL · ${CTX[r.ctx]||'임의'}</small>`;
  if(r.type==='bp')return `${r.sys}/${r.dia}<small> mmHg${r.pulse?' · 맥박 '+r.pulse:''}</small>`;
  const b=bmiOf(r.w);return `${r.w}<small> kg${b?' · BMI '+b.toFixed(1):''}</small>`;
}

/* ---------- 데이터 ---------- */
function addRec(r){
  const sig=x=>[x.type,Math.floor(x.t/60000),x.v,x.sys,x.dia,x.w].join('|');
  const s=sig(r);if(recs.some(x=>sig(x)===s))return 0;
  r.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  recs.push(r);return 1;
}
function normalize(r){
  const t=typeof r.t==='number'?r.t:parseT(r.t);if(!t)return null;
  const n=x=>{const v=parseFloat(x);return isFinite(v)&&v>0?v:null};
  const ty=r.type;
  if(ty==='glucose'){const v=n(r.v);return v?{type:ty,t,v,ctx:CTX[r.ctx]?r.ctx:'random',src:r.src||'import'}:null}
  if(ty==='bp'){const s=n(r.sys),d=n(r.dia);return s&&d?{type:ty,t,sys:s,dia:d,pulse:n(r.pulse)||undefined,src:r.src||'import'}:null}
  if(ty==='weight'){const w=n(r.w);return w?{type:ty,t,w,src:r.src||'import'}:null}
  return null;
}
const TMAP={glucose:'glucose',혈당:'glucose',bp:'bp',혈압:'bp',weight:'weight',체중:'weight'};
function importText(txt){
  txt=(txt||'').trim();if(!txt)return -1;
  let list=[];
  if(txt[0]==='['||txt[0]==='{'){
    try{let j=JSON.parse(txt);if(!Array.isArray(j))j=j.records||[j];list=j}catch(e){return -1}
  }else{
    txt.split(/\r?\n/).forEach(line=>{
      const p=line.split(',').map(x=>x.trim());const ty=TMAP[p[0]];if(!ty)return;
      if(ty==='glucose')list.push({type:ty,t:p[1],v:p[2],ctx:p[3]});
      if(ty==='bp')list.push({type:ty,t:p[1],sys:p[2],dia:p[3],pulse:p[4]});
      if(ty==='weight')list.push({type:ty,t:p[1],w:p[2]});
    });
  }
  let n=0;list.forEach(r=>{const x=normalize(r);if(x)n+=addRec(x)});
  if(n){save()}return n;
}
function urlImport(){
  const q=new URLSearchParams(location.search);if(![...q.keys()].length)return;
  const t=parseT(q.get('t'))||Date.now();
  const num=k=>{const v=parseFloat(q.get(k));return isFinite(v)&&v>0?v:null};
  let n=0;const g=num('g'),s=num('s'),d=num('d'),w=num('w');
  if(g)n+=addRec({type:'glucose',t,v:g,ctx:CTX[q.get('gc')]?q.get('gc'):'random',src:'health'});
  if(s&&d)n+=addRec({type:'bp',t,sys:s,dia:d,pulse:num('p')||undefined,src:'health'});
  if(w)n+=addRec({type:'weight',t,w,src:'health'});
  const h=num('h');if(h){set.height=h}
  history.replaceState(null,'',location.pathname);
  save();
  setTimeout(()=>toast(n?`건강 앱 값 ${n}건 기록됨`:'새로 추가된 값이 없습니다'),300);
}

/* ---------- 그래프 ---------- */
function chart(type,days){
  const from=days?Date.now()-days*864e5:0;
  const rs=recs.filter(r=>r.type===type&&r.t>=from).sort((a,b)=>a.t-b.t);
  if(rs.length<2)return '<p class="muted">기록이 2개 이상 쌓이면 그래프가 표시됩니다.</p>';
  const ser=type==='bp'?[['sys','#e5484d'],['dia','#2f8f9f']]:type==='glucose'?[['v','#e5484d']]:[['w','#2f8f9f']];
  let refs=type==='glucose'?[100,126]:type==='bp'?[80,90,120,140]:[];
  if(type==='weight'){const h=parseFloat(set.height);if(h>0){const m=Math.pow(h/100,2);refs=[+(23*m).toFixed(1),+(25*m).toFixed(1)]}}
  let vals=[];rs.forEach(r=>ser.forEach(s=>vals.push(r[s[0]])));
  let mn=Math.min(...vals,...refs),mx=Math.max(...vals,...refs);const pad=(mx-mn)*.08||2;mn-=pad;mx+=pad;
  const W=340,H=190,pl=34,pr=8,pt=10,pb=22,t0=rs[0].t,t1=rs[rs.length-1].t||1;
  const X=t=>pl+(t1===t0?.5:(t-t0)/(t1-t0))*(W-pl-pr);
  const Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  let o=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3;o+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="currentColor" opacity=".12"/><text x="2" y="${Y(v)+3}">${Math.round(v)}</text>`}
  refs.forEach(v=>{o+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e07b1a" stroke-dasharray="4 3" opacity=".7"/>`});
  ser.forEach(s=>{
    o+=`<polyline fill="none" stroke="${s[1]}" stroke-width="2" points="${rs.map(r=>X(r.t)+','+Y(r[s[0]])).join(' ')}"/>`;
    rs.forEach(r=>{o+=`<circle cx="${X(r.t)}" cy="${Y(r[s[0]])}" r="2.6" fill="${s[1]}"/>`});
  });
  const d0=new Date(t0),d1=new Date(t1);
  o+=`<text x="${pl}" y="${H-6}">${d0.getMonth()+1}/${d0.getDate()}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${d1.getMonth()+1}/${d1.getDate()}</text></svg>`;
  const lg=type==='bp'?'<span style="color:#e5484d">● 수축기</span> <span style="color:#2f8f9f">● 이완기</span> · ':'';
  return o+`<div class="muted">${lg}점선 = 기준선</div>`;
}

/* ---------- 화면 ---------- */
function renderNav(){$('#nav').innerHTML=TABS.map(t=>`<button data-tab="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')}
function latest(type){return recs.filter(r=>r.type===type).sort((a,b)=>b.t-a.t)[0]}
function avg(type,key,days){
  const from=Date.now()-days*864e5,a=recs.filter(r=>r.type===type&&r.t>=from).map(r=>r[key]);
  return a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
}
function viewHome(){
  let o='';
  ['glucose','bp','weight'].forEach(ty=>{
    const r=latest(ty),st=r&&statusOf(r);
    let a7='';
    if(ty==='glucose'&&avg(ty,'v',7))a7=`7일 평균 ${avg(ty,'v',7).toFixed(0)} mg/dL`;
    if(ty==='bp'&&avg(ty,'sys',7))a7=`7일 평균 ${avg(ty,'sys',7).toFixed(0)}/${avg(ty,'dia',7).toFixed(0)} mmHg`;
    if(ty==='weight'&&avg(ty,'w',7))a7=`7일 평균 ${avg(ty,'w',7).toFixed(1)} kg`;
    o+=`<div class="card" data-go="${ty}" style="cursor:pointer"><div class="row" style="justify-content:space-between;align-items:center"><h3 style="margin:0">${NAME[ty]}</h3>${st?badge(st):''}</div>`+
      (r?`<div class="big">${valText(r)}</div><div class="muted">${fmt(r.t)}${a7?' · '+a7:''}</div>`:'<div class="muted">아직 기록이 없습니다 — 눌러서 입력</div>')+'</div>';
  });
  const rec=[...recs].sort((a,b)=>b.t-a.t).slice(0,8);
  if(rec.length)o+=`<div class="card"><h3>최근 기록</h3>${rec.map(r=>`<div class="item"><div class="l"><b>${NAME[r.type]}</b> <span class="muted">${fmt(r.t)}${r.src==='health'?' · 건강앱':''}</span><div>${valText(r)}</div></div>${(s=>s?badge(s):'')(statusOf(r))}</div>`).join('')}</div>`;
  o+='<p class="muted">※ 참고용 기록장이며 진단·치료를 대신하지 않습니다. 기준 값은 [기준] 탭에서 확인하세요.</p>';
  return o;

function render(){
  renderNav();
  $('#main').innerHTML=tab==='home'?viewHome():tab==='criteria'?viewCriteria():tab==='sync'?viewSync():viewType(tab);
  const f=$('#hx-file');if(f)f.onchange=()=>importHealthXml(f.files[0]);

/* ---------- 건강 앱 export.xml ---------- */
async function importHealthXml(file){
  if(!file)return;const msg=$('#hx-msg');
  const days=parseInt($('#hx-days').value),since=days?Date.now()-days*864e5:0;
  const re=/<Record\s+type="HKQuantityTypeIdentifier(BloodGlucose|BloodPressureSystolic|BloodPressureDiastolic|BodyMass)"[^>]*>/g;
  const at=(tag,n)=>{const m=tag.match(new RegExp(n+'="([^"]*)"'));return m?m[1]:null};
  const pd=s=>{const m=s&&s.match(/(\d{4}-\d\d-\d\d) (\d\d:\d\d:\d\d) ([+-])(\d\d)(\d\d)/);return m?new Date(`${m[1]}T${m[2]}${m[3]}${m[4]}:${m[5]}`).getTime():null};
  const sys={},dia={},out=[];const CH=16*1024*1024;let off=0,tail='';
  try{
    while(off<file.size){
      msg.textContent=`읽는 중… ${Math.round(off/file.size*100)}%`;
      await new Promise(r=>setTimeout(r));
      let txt=tail+await file.slice(off,off+CH).text();off+=CH;
      const cut=txt.lastIndexOf('>');tail=txt.slice(cut+1);txt=txt.slice(0,cut+1);
      let m;re.lastIndex=0;
      while((m=re.exec(txt))){
        const tag=m[0],t=pd(at(tag,'startDate'));if(!t||t<since)continue;
        let v=parseFloat(at(tag,'value'));if(!isFinite(v))continue;const u=at(tag,'unit')||'';
        if(m[1]==='BloodGlucose'){if(/mmol/i.test(u))v=Math.round(v*18.0182);out.push({type:'glucose',t,v:Math.round(v),ctx:'random'})}
        else if(m[1]==='BodyMass'){if(/lb/i.test(u))v=v*0.45359237;if(/^g$/i.test(u))v=v/1000;out.push({type:'weight',t,w:Math.round(v*10)/10})}
        else if(m[1]==='BloodPressureSystolic')sys[t]=v;else dia[t]=v;
      }
    }
    Object.keys(sys).forEach(t=>{if(dia[t])out.push({type:'bp',t:+t,sys:Math.round(sys[t]),dia:Math.round(dia[t])})});
    let n=0;out.forEach(r=>{r.src='health';n+=addRec(r)});save();render();
    toast(n?`건강 앱 데이터 ${n}건 가져옴`:'가져올 새 데이터가 없습니다');
  }catch(e){msg.textContent='읽기 실패: '+e.message}
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-tab],[data-go],[data-add],[data-range],[data-del],[data-act]');if(!b)return;
  const d=b.dataset;
  if(d.tab){tab=d.tab;render();window.scrollTo(0,0)}
  else if(d.go){tab=d.go;render();window.scrollTo(0,0)}
  else if(d.range!==undefined){range=+d.range;render()}
  else if(d.del){if(confirm('이 기록을 삭제할까요?')){recs=recs.filter(r=>r.id!==d.del);save();render()}}
  else if(d.add){
    const ty=d.add,t=parseT($('#f-t').value)||Date.now(),n=id=>{const x=$(id);const v=x?parseFloat(x.value):NaN;return isFinite(v)&&v>0?v:null};
    let r=null;
    if(ty==='glucose'){const v=n('#f-v');if(!v)return toast('혈당 값을 입력하세요');r={type:ty,t,v,ctx:$('#f-ctx').value}}
    if(ty==='bp'){const s=n('#f-s'),dd=n('#f-d');if(!s||!dd)return toast('수축기/이완기를 입력하세요');if(s<=dd)return toast('수축기가 이완기보다 커야 합니다');r={type:ty,t,sys:s,dia:dd,pulse:n('#f-p')||undefined}}
    if(ty==='weight'){const w=n('#f-w');if(!w)return toast('몸무게를 입력하세요');const h=n('#f-h');if(h)set.height=h;r={type:ty,t,w}}
    r.src='manual';
    if(addRec(r)){save();render();const s=statusOf(r);toast('저장됨'+(s?' · '+s.t:''))}else toast('이미 같은 기록이 있습니다');
  }
  else if(d.act==='clip'){
    try{const t=await navigator.clipboard.readText();const n=importText(t);render();toast(n<0?'가져올 수 없는 형식입니다':n?`${n}건 가져옴`:'새로 추가된 기록이 없습니다')}
    catch(err){toast('클립보드 접근이 거부됨 — 아래에 붙여넣어 주세요')}
  }
  else if(d.act==='paste'){const n=importText($('#paste').value);render();toast(n<0?'가져올 수 없는 형식입니다':n?`${n}건 가져옴`:'새로 추가된 기록이 없습니다')}
  else if(d.act==='h'){const h=parseFloat($('#s-h').value);set.height=h>0?h:'';save();toast('키 저장됨')}
  else if(d.act==='export'){
    const j=JSON.stringify(recs);
    try{await navigator.clipboard.writeText(j);toast('백업이 복사되었습니다. 메모 등에 붙여넣어 보관하세요')}
    catch(err){$('#paste')&&($('#paste').value=j);toast('아래 칸의 내용을 직접 복사하세요')}
  }
  else if(d.act==='wipe'){if(confirm('모든 기록을 삭제합니다. 되돌릴 수 없어요.')&&confirm('정말 삭제할까요?')){recs=[];save();render();toast('삭제됨')}}
});
document.addEventListener('change',e=>{
  const id=e.target.dataset&&e.target.dataset.ctx;
  if(id){const r=recs.find(x=>x.id===id);if(r){r.ctx=e.target.value;save();render()}}
});
urlImport();render();
</script>
